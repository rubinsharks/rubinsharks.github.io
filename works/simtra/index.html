<html>

		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css"></link>

	<body class="mx-auto bg-white w-screen h-screen">

									<li>

									</li>
									<li>
										<a aria-current="page" href="/works/" class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0">
										Works	
										</a>
									</li>
								</ul>
							</div>
